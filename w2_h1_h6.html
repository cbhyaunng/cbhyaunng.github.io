<!DOCTYPE html>
<!-- html5 문서라는 뜻 
 비쥬얼 스튜디오에서 !엔터로 기본양식 불러올수 있음 -->
<html>
<head>
    <meta charset="UTF-8">
    <!-- 이게 없으면 한글 깨짐 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제목 연습(h1~h6)</title>
</head>
<body>
    <h1>글자 제목(h1)</h1>
    <h2>글자 제목(h2)</h2>
    <h3>글자 제목(h3)</h3>
    <h4>글자 제목(h4)</h4>
    <h5>글자 제목(h5)</h5>
    <h6>글자 제목(h6)</h6>
    <!-- h숫자 숫자가 커질수록 글자 크기가 작아진다. 1,2,3만 주로 사용 -->

    안녕하세요.
    반갑습니다.
    <br> 안녕하세요. &nbsp; 반갑습니다. <br>
    <!-- &nbsp;는 빈 공간을 만드는 HTML 엔티티. <br>는 줄바꿈(개행) -->

    &lt; &gt; &amp; &quot; <br>
    <!-- &lt;는 < 를, &gt;는 > 를, &amp;는 & 를, &quot;는 " 를 나타냄 -->
    &#60; &#62; &#38; &#34; <br>
    <!-- &#숫자;는 유니코드 문자 표현 방식. -->
    &copy; &reg; <br>
    <!-- &copy;는 저작권 기호, &reg;는 등록 상표 기호 -->
    &#169; &#174; &#8482; &#409; &#41; <br>

</body>
</html></i>
