<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css 링크</title>

<style>
    /* a:link은 방문하지 않은 링크, a:visited는 방문한 링크, a:hover는 마우스를 올렸을 때, a:active는 클릭했을 때의 스타일을 지정하는 선택자입니다. */
    /* a:link, a:visited, a:hover, a:active 순서로 작성해야 함/ 순서 바꾸면 안됨 */
    a:link{
        color: #0000ff;
        text-decoration:none;   
    }
    a:visited{
        color: #00ff00;
    }
    a:hover{
        color: #ff0000;
        font-weight: bold;
        text-decoration: underline;
    }
    a:active{
        color: #00ffff;
    }
</style>
</head>
<body>
    <a href="#">자유게시판</a>
    <!-- 임시링크 # -->
</body>
</html>
