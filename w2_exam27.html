<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>순서가 있는 목록 태그에 대하여 알아봅시다.</title>
</head>
<body>
    <!-- 숫자 형태의 목록 -->
    <h3>강아지 품종별 인기순위</h3>
    <ol>
        <li>골든 리트리버</li>
        <li>페키니즈</li>
        <li>시츄</li>
        <li>토이 푸들</li>
    </ol>

    <!-- 영문자 대문자 형태의 목록, 시작번호 변경 -->
    <h3>고양이 품종별 인기순위</h3>
    <ol type="A" start="5">
        <li>터키쉬 안고라</li>
        <li>브리티시 숏헤어</li>
        <li value="1">러시안 블루</li>
        <!-- 1번부터 다시 시작 -->
        <li type="a">아메리칸 숏헤어</li>
    </ol>

    <!-- 로마자 대문자 형태의 목록 -->
    <h3>사료 인기순위</h3>
    <ol type="I">
        <li>사이언스 다이어트</li>
        <li>로열 캐닌</li>
        <li type="1">AFN</li>
        <!-- 타입만 숫자로 바뀌로 순서는 그대로 3이 나옴 -->
        <li type="i">유카누바</li>
    </ol>
</body>
</html>
