<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0; /* 모든 요소의 기본 여백 제거 */
            padding:0; /* 모든 요소의 기본 패딩 제거 */
        }
        ul{
            list-style:none; /* 목록의 기본 스타일 제거 */
        }
        #menu{
            width:500px; 
            padding:20px;
            margin:20px 0 0 40px;
            background-color: #eeeeee;
            border:solid 1px #aaaaaa; 
            text-align: center;
        }
        #menu li{
            display:inline; /* 리스트 아이템을 인라인 요소로 변경하여 가로로 나열 / 리스트는 원래 블록태그임 */
        }
        a{
            display: block; /* 링크를 블록 요소로 변경하여 전체 영역이 클릭 가능하도록 설정 */
            margin:20px 0 0 40px;
        }
    </style>
</head>
<body>
    <ul id="menu">
        <li>회사소개 |</li>
        <li>제품소개 |</li>
        <li>공지사항 |</li>
        <li>업무제휴 |</li>
        <li>고객센터</li>
    </ul>
    <p>수직 방향 메뉴</p>
    <a href="http://naver.com" target="_blank">네이버</a> 
    <a href="http://google.com" target="_blank">구글</a>
    <a href="http://daum.net" target="_blank">다음</a>
    <a href="index.html">돌아가기</a>
    <!-- target="_blank"는 링크를 새 창에서 열도록 설정 -->
</body>
</html>
