<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h3 {
            width: 500px;
        }
        #border1 {
            border: solid 5px #ff0000;
        }
        #border2 {
            border: double 5px #00ff00;
        }
        #border3 {
            border-top: dotted 1px #0000ff;
            border-bottom: dashed 1px #0000ff;
        }
        #border4 {
            border-left: solid 3px #ff00ff;
            border-right: solid 3px #ff00ff;
        }
        #login_box {
            width: 200px;
            height: 150px;
            background-color:#eeeeee;
            border:solid 1px #aaaaaa;
            border-radius:15px; /* 테두리의 모서리를 둥글게 만드는 속성입니다. 숫자가 클수록 더 둥글게 됩니다. */
            box-shadow: 6px 6px 5px #888888; /* 요소에 그림자 효과를 추가하는 속성입니다. 첫 번째와 두 번째 값은 그림자의 수평 및 수직 오프셋을 나타내며, 세 번째 값은 그림자의 흐림 정도를 나타냅니다. 네 번째 값은 그림자의 색상을 지정합니다. */
            text-align:center; /* 텍스트를 가로로 가운데 정렬하는 속성입니다. */
        }
    </style>
</head>
<body>
    <h3 id="border1">Solid Border</h3>
    <h3 id="border2">Double Border</h3>
    <h3 id="border3">Top and Bottom Borders</h3>
    <h3 id="border4">Left and Right Borders</h3>
    <div id="login_box">로그인 화면</div>
</body>
</html>
