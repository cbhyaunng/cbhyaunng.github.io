<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>순서 없는 목록</title>
</head>
<body>
    <h2>식물원 관람 유의사항</h2>
    <ul type="circle">
        <!-- 타입지정 안하면 기본값은 디스크 형태(색칠된 검정 원) -->
        <li type="square">입장권에 게시된 관람요령을 살펴보시기 바랍니다.</li>
        <li>안내원의 안내에 따라주시기 바랍니다.</li>
        <li type="square">관람 지역 이외의 출입제한 지역은 출입을 금합니다</li> <!-- 그 줄에 지정하는 것이 우선순위가 높음-->
        <li>식물이 식재된 곳에 들어가지 마십시오.</li>
    </ul>
    <!-- <ul>은 순서 없는 목록을 나타내는 태그입니다. <li>는 목록의 항목을 나타냅니다. ul 이나 ol을 써야 li 이 보임 -->
    
    <ul>
        <li>입장권에 게시된 관람요령을 살펴보시기 바랍니다.</li>
        <li>안내원의 안내에 따라주시기 바랍니다.</li>
        <li>관람 지역 이외의 출입제한 지역은 출입을 금합니다</li>
        <li>식물이 식재된 곳에 들어가지 마십시오.</li>
    </ul>        
</body>
</html>
