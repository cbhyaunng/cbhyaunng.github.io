<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        /* 클래스 선택자 */ 
        h1.orange {
            color: #ff6600;
            font-weight: bold;
            text-decoration: underline;
        }
        h2.orange {
            color: #ff6600;
        }
        p.blue {
            color: #0000ff;
            font-style: italic;
        }
         /* 클래스 선택자 여러번 사용가능 */
         /*클래스 선택자란 여러 요소에 공통적으로 적용할 수 있는 스타일을 정의 */
        span.blue {
            color: #0000ff;
            font-style: bold;
        }
    </style>
</head>
<body>
    <h1 class="orange">제 1회 봄빛 수목원 여름꽃 축제</h1>
    <h2 class="orange">수련 수국 무궁화 원추리</h2>
    <p class="blue">아름다운 여름꽃과 시원한 바다를 경험할 수 있는 기획입니다.</p>
    <ul>
        <li>일시 : <span class="blue">6월15일부터 8월15일까지</span></li>
        <li>장소 : 봄빛 수목원</li>
    </ul>
</body>
</html>
