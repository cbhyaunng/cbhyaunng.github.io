<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        table {
            border:none;
            border-collapse: collapse; /* 테이블 경계선 병합 */
            width: 700px;          /*표 전체 너비*/
        }
    </style>
    <title></title>
</head>
<body>
    <table>
        <tr>
            <td>이름</td>
            <td>
                <input type="text"> <!-- type 속성은 입력 양식을 지정하는 속성입니다. text는 한 줄로 된 텍스트 입력 양식입니다. -->
            </td>
        </tr>
        <tr>
            <td>나이</td>
            <td>
                <input type="number"> <!-- 숫자만 입력가능 -->
            </td>
        </tr>
        <tr>
            <td>비밀번호</td>
            <td>
                <input type="password"> <!-- 입력한 글자 대신 점으로 보이는 형태 -->
            </td>
        </tr>
        <tr>
            <td>개인정보</td>
            <td>
                <input type="radio" name="info" checked>공개 <!--checked-기본으로 체크되어있음-->
                <input type="radio" name="info">비공개 <!--info 그룹에서 하나만 선택가능-->
            </td>
        </tr>
        <tr>
            <td>취미</td>
            <td>
                <input type="checkbox" name="hobby1">등산
                <input type="checkbox" name="hobby2" checked>독서
                <input type="checkbox" name="hobby3">영화감상
                <input type="checkbox" name="hobby4">음악감상 <!-- name 꼭 달라야함 -->
            </td>
        </tr>
        <tr>
            <td>이메일</td>
            <td>
                <input type="text">@
                    <select name="" id=""> <!-- select 태그는 드롭다운 목록을 만드는 태그입니다.  -->
                        <option>선택</option> <!-- option 태그는 select 태그 안에서 선택할 수 있는 항목을 정의하는 태그입니다. -->
                        <option value="">naver.com</option>
                        <option value="">gmail.com</option>
                        <option value="">직접입력</option>
                    </select>
            </td>
        </tr>
        <tr>
            <td>자기소개</td>
            <td>
                <textarea rows="5" cols="60"></textarea> <!-- 여러 줄로 된 텍스트 입력 양식입니다. rows는 텍스트 영역의 행 수를 지정하는 속성입니다. cols는 텍스트 영역의 열 수를 지정하는 속성입니다. -->
            </td>
        </tr>
        <tr>
            <td>
                <button type="button">검색</button> <!-- type="button"은 버튼을 클릭해도 아무런 동작이 일어나지 않도록 지정하는 속성입니다. -->
            </td>
            <td>
                <button type="submit">확인</button> <!-- type="submit"은 버튼을 클릭하면 폼이 제출되도록 지정하는 속성입니다. -->
            </td>
        </tr>
        <tr>
            <td>파일첨부</td>
            <td>
                <input type="file">*2MB까지 가능 <!-- 파일 선택 양식입니다. 사용자가 컴퓨터에서 파일을 선택할 수 있도록 합니다. -->
            </td>
        </tr>
        <tr>
            <td>색</td>
            <td>
                <input type="color"> <!-- 색상 선택 양식입니다. 사용자가 색상을 선택할 수 있도록 합니다. -->
            </td>
        </tr>
        <tr>
            <td>날짜시간</td>
            <td>
                <input type="datetime-local"> <!-- 날짜와 시간을 모두 입력할 수 있는 양식입니다. -->
            </td>
        </tr>
        <tr>
            <td>달</td>
            <td>
                <input type="month"> <!-- 월 선택 양식입니다. 사용자가 연도와 월을 선택할 수 있도록 합니다. -->
            </td>
        </tr>
        <tr>
            <td>숫자</td>
            <td>
                <input type="number"> <!-- 숫자 입력 양식입니다. 사용자가 숫자를 입력할 수 있도록 합니다. -->
            </td>
        </tr>
        <tr>
            <td>범위</td>
            <td>
                <input type="range"> <!-- 범위 입력 양식입니다. 사용자가 슬라이더를 사용하여 값을 선택할 수 있도록 합니다. -->
            </td>
        </tr>
        <tr>
            <td>시간</td>
            <td>
                <input type="time"> <!-- 시간 입력 양식입니다. 사용자가 시간을 입력할 수 있도록 합니다. -->
            </td>
        </tr>
        <tr>
            <td>주</td>
            <td>
                <input type="week"> <!-- 주 입력 양식입니다. 사용자가 연도와 주를 선택할 수 있도록 합니다. -->
            </td>
        </tr>

    </table>
    <br>
    <button onclick="location.href='index.html'">시간표</button>
    &nbsp;&nbsp;
    <button onclick="location.href='w4_weather.html'">일기예보</button>
