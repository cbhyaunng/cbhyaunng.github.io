<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            width:400px; /* 너비 지정 , 단위는 '꼭' 써야함 */
            border:solid 5px #00ffff;
            padding:10px 20px 30px 40px; /* 위 오른쪽 아래 왼쪽  */
            margin: 20px 40px 60px 80px; /* 위 오른쪽 아래 왼쪽 , 브라우저의 위치적인 값은 위쪽과 왼쪽이 결정 */
            /* 마진과 패딩  */
        }
    </style>
</head>
<body>
    <p>
        봄빛 식물원은 2017년 12월 개우너한 이래 방문한 고객들에게 자연과 더불어 사는 즐거움을 선사하고 
        자연과의 만남을 통해 삶의 여유와 행복을 제공하고 있습니다.
    </p>

</body>
</html>
