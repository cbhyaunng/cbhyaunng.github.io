<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>봄빛 수목원 직원 채용</title>
    <style>
        #document span {
            color: #ff0000;
        }
        #method span {
            color: #0000ff;
            font-weight: bold;
        }
         /* 아이디 선택자란 문서 내에서 유일한 요소에 적용되는 스타일을 정의 */
         /* 아이디 선택자는 #으로 시작하며, 해당 아이디를 가진 요소에 스타일을 적용 */

    </style>
</head>
<body>
    <h1>봄빛 수목원 직원 채용 안내</h1>
    <h2>제출 서류</h2>
    <ul id="document">
        <li><span>이력서</span>(첨부양식을 다운로드하여 작성)</li>
        <li><span>자기소개서</span>(자유 형식으로 경험을 위주로 작성)</li>
        <li><span>주민등록등본</span>(주소 이동 내역 포함)</li>
    </ul>
    <h2>제출 방법</h2>
    <ul id="method">
        <li>인사담당자에게 이메일 제출</li>
        <li>이메일주소 : <span>abc@naver.com</span></li>
    </ul>
</body>
</html>
