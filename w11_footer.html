<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오사카 여행</title>
    <style>
        #page{
            width:980px;
            margin:0 auto;
        }
        footer{
            padding: 20px 0 0 15px;
            border-top:solid 3px #06b5b8;
            color:#666666;
        }
        footer #address{
            float:left;

        }
        footer #link{
            float:right;
        }
        footer #footer_menu li{
            margin-top:5px;
        }
        footer #company_info{
            margin-top:20px;
        }
        footer #company_info li{
            margin-top:2px;
        }
        footer #copyright{
            margin-top:10px;
            font-size:11px;
            color:#888888;
        }
        footer #link h3{
            font-size:16px;
            color:#06b5b8;
        }
        footer #link select{
            margin:5px 0 0 50px;
            width:100px;
            height:18px;
            font-size:11px;
        }
        footer #icons{
            margin-top:5px;
            text-align:right;
        }
    </style>
</head>
<body>
    <div id="page">
        <footer>
            <article id="address">
                <ul id="footer_menu">
                    <li>개인정보 취급방침 | 이용 안내 | 이메일 무단수집 거부</li>
                    <li>서민금융 119 서비스</li>
                </ul>
                <ul id="company_info">
                    <li>회사명 : 오사카 여행</li>
                    <li>대표 : 홍길동</li>
                    <li>주소 : 서울특별시 강남구 테헤란로 123</li>
                    <li>전화 : 02-1234-5678</li>
                    <li id="copyright">© 2023 오사카 여행. All rights reserved.</li>
                </ul>
            </article>
            <article id="link">
                <h3>관련사이트</h3>
                <select>
                    <option value="">선택하세요</option>
                    <option value="https://www.osaka-info.jp/en/">오사카 관광 공식 사이트</option>
                    <option value="https://www.japan.travel/en/destinations/kansai/osaka/">일본 관광 공식 사이트 - 오사카</option>
                    <option value="https://www.osakastation.com/">오사카 스테이션 시티</option>
                </select>
                <div id="icons">
                    <img src="facebook.png" alt="페이스북" width="24" height="24">
                    <img src="twitter.png" alt="트위터" width="24" height="24">
                    <img src="instagram.png" alt="인스타그램" width="24" height="24">
                </div>
            </article>
        </footer>
    </div>
    
</body>
</html>
