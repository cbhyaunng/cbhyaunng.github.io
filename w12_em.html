<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        body{
            font-size: 100%;
            /* 100%는 16px임 */
        }
        #a{
            font-size: 150%;
        }
        #b{
            font-size: 2em;
            /* 2em은 body의 font-size(16px)의 2배이므로 32px임/ 기준값이 바뀌면 얘도 바뀜 */
        }
    </style>
</head>
<body>
    Hello! I'm Genius!!!
    <div id="a">Hello! I'm Genius!!!</div>
    <div id="b">Hello! I'm Genius!!!</div>
</body>
</html>
