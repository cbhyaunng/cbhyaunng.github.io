<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    table {
            border:none;
            border-collapse: collapse;
            width: 700px;          /*표 전체 너비*/
        }
    </style>
    <title>회원가입</title>
</head>
<body>
    <h3>회원가입 신청서</h3>
    <table>
        <tr>
            <td>이름</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>생년월일</td>
            <td><input type="date"></td>
        </tr>
        <tr>
            <td>성별</td>
            <td>
                <input type="radio" name="info" checked>남성 
                <input type="radio" name="info">여성
            </td>
        </tr>
        <tr>
            <td>전화번호</td>
            <td>
                <select name="" id="">
                    <option>02</option>
                    <option>031</option>
                    <option>82</option>
                    <option>직접입력</option>
                </select>
                - <input type="text"> - <input type="text">
            </td>
        </tr>
        <tr>
            <td>id</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>password</td>
            <td><input type="password"></td>
        </tr>
        <tr>
            <td>이메일</td>
            <td>
                <input type="text">@
                <select name="" id="">
                <option>선택</option>
                <option value="">naver.com</option>
                <option value="">gmail.com</option>
                <option value="">직접입력</option>
                </select>
            </td>
        </tr>
    </table>
</body>
</html>
