<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>야생화</title>
</head>
<body>
    <h3>무궁화</h3>
    <img src="flower.jpg" alt="무궁화"><br> <!-- 확장자도 정확히 써야함 -->
    <!-- alt는 이미지가 로드되지 않았을 때 표시되는 텍스트 -->
    <p>무궁화는 낙엽 관목으로서 여러 품종이 있고 높이가 3-4m에 달하며, 어린 가지에 털이 많으나 점차 없어진다.
        무궁화는 정원에서 재배가 쉽고 씨로 번식이 가능하지만 꺽꽂이로 번식되므로 형질을 변형시키지 않고 유지하는 것이 쉽다.</p>
</body>
</html>
