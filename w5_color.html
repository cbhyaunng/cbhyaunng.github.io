<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color 속성</title>
    <style>
        p {
            color: red;
            line-height:150%;
        }
        h3 {
            color: #912bc5;
            text-align: center;
            text-decoration:underline;
            text-shadow: 3px 3px 5px #444444;
            /* right bottom 시계방향/흐린정도/그림자색상  */
        }
    </style>
</head>
<body>
    <h3>제비꽃</h3>
    <p>제비꽃은 우리나라 전역의 산과 들에 자라는 다년생 풀이다.</p>
</body>
</html>
