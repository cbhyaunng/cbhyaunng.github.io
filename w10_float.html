<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<style>
    div{
        width: 200px;
        height: 100px;
        border:solid 1px #00ff00;
    }
    #box_a{
        float: left; /* float 속성은 요소를 왼쪽 또는 오른쪽으로 띄워서 배치하는 속성 */
    }
    #box_b{
        float: right; /* float 속성은 요소를 왼쪽 또는 오른쪽으로 띄워서 배치하는 속성 */
    }
</style>
<body>
    <div id="box_a">박스 a</div>
    <div id="box_b">박스 b</div>
</body>
</html>
