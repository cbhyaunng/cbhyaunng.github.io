<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        header{
            height:80px;
            background-color: #cccccc;

        }
        aside{
            width:25%;
            height:300px;
            background-color: #ffff00;
            float:left;
        }
        main{
            width:75%;
            height:300px;
            background-color: #00ff00;
            float:left;
        }


        footer{
            height:80px;
            background-color: #cccccc;
            clear:both;
        }

    </style>
</head>
<body>
    <header>
        헤더콘텐츠
    </header>
    <aside>
        좌측 콘텐츠
    </aside>
    <main>
        메인 콘텐츠
    </main>
    <footer>
        푸터 콘텐츠
    </footer>
</body>
</html>
