<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css구조</title>
    <!-- 내부 스타일 시트 -->
    <style>
        p { /*선택자*/
            color: blue;
            font-size: 20px;
        }
        h3 {
            color: green;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <h3>제목입니다.</h3>
    <!-- <h3 style="color: #ff0000; font-size: 18px;">제목입니다.</h3>  -->
    <!--인라인 스타일, 우선순위 가장높음/빨간색 들어감, 유지보수 어려움-->
    <p>나무의 줄기는 땅 위로 계속 높게 자라고 해마다 굵기가 두꺼워지지만, 
    풀의 줄기는 일 년만 자라고 겨울을 나는 동안 땅 윗부분이 죽는다
    </p>
</body>
</html>
