<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정의 목록</title>
</head>
<body>
    <!-- 정의 목록을 나타낼 때 사용 -->
    <!-- definition list, difinition title, difinition data -->
    <h3>계절별 야생화</h3>
    <dl>
        <dt>봄꽃</dt>
        <dd>봄에 꽃이 피는 다년생 식물을 꽃잔디, 할미꽃, 어성초, 복수초 등이 있다.</dd>

        <dt>여름꽃</dt>
        <dd>여름에 꽃이 피는 식물은 옥장화,비비추, 수국, 달맞이꽃, 엉겅퀴 등이 있다</dd>

        <dt>가을꽃</dt>
        <dd>가을에 꽃이 피는 예쁜 식물은 구절초, 억새, 쑥부렁이, 갈대등이 있다.</dd>

        <dt>여러 계절</dt>
        <dd>추운 겨울을 제외한 계절에 걸쳐 오랫동안 꽃을 볼 수 있는 식물은 분홍비늘꽃, 사계 파랭이꽃, 송엽국 등이 있다.</dd>
    </dl>
</body>
</html>
