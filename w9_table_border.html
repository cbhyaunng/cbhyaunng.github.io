<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, td, th{
            border:solid 1px #000000; 
            border-collapse:collapse; /* 테이블 경계선 병합 */
            text-align: center;;
        }
        table{
            width: 600px;          /*표 전체 너비*/
        }
        #table_title{
            height: 30px;
            background-color: #bcbcbc;
        }
        #col1{
            width: 30px;
        }
        #col2,#col3{
            width: 80px;
        }
        #col4,#col5{
            width: 120px;
        }
        #col6{
            width: 60px;
        }
        .number{
            background-color: pink;
        }
    </style>
</head>
<body>
    <h2>KTX 열차표 예매</h2>
    <table>
        <tr id="table_title">
            <th id="col1">열차번호</th>
            <th id="col2">출발</th>
            <th id="col3">도착</th>
            <th id="col4">특실</th>
            <th id="col5">일반실</th>
            <th id="col6">소요시간</th>
        </tr>
        <tr>
            <td class="number">175</td>
            <td>서울<br>21:00</td>
            <td>부산<br>23:44</td>
            <td><img src="soldout.png" alt="" width="100"></td>
            <td><img src="soldout.png" alt="" width="100"></td>
            <td>02:44</td>
        </tr>
        <tr>
            <td class="number">177</td>
            <td>서울<br>21:30</td>
            <td>부산<br>00:08</td>
            <td><img src="booking.png" alt="" width="100"></td>
            <td><img src="booking.png" alt="" width="100"></td>
            <td>02:38</td>
        </tr>
        <tr>
            <td class="number">175</td>
            <td>서울<br>22:00</td>
            <td>부산<br>00:42</td>
            <td><img src="booking.png" alt="" width="100"></td>
            <td><img src="booking.png" alt="" width="100"></td>
            <td>02:42</td>
        </tr>
    </table>
    
</body>
</html>
