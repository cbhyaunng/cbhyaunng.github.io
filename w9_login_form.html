<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 페이지</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        ul{
            list-style:none;
        }
        body{
            font-family: "맑은 고딕", "돋움";
            font-size:12px;
            color:#444444;
        }
        #login_box{
            width:220px;
            height: 120px;
            padding:10px 0 0 15px;
            margin:10px 0 0 15px;
            border:solid 1px #bbbbbb;
            border-radius:15px; /* 테두리의 모서리를 둥글게 만드는 속성입니다. 숫자가 클수록 더 둥글게 됩니다. */
            
        }
        h2{
            font-family: "Arial";
            margin-bottom: 10px;
        }
        #login_box input{
            width:100px;
            height:20px;
        }
        #id_pass, #login_btn{
            display:inline-block;
            vertical-align: top;
        }
        #id_pass span{
            display:inline-block;
            width:20px;
        }
        #pass{
            margin-top:3px;
        }
        #login_btn button{
            width:80px;
            padding:12px;
            border-radius:5px;
        }
        #btns{
            margin: 12px 0 0 0;
            text-decoration: underline;
        }
        #btns li{
            margin-left:10px;
            display:inline;
        }
    </style>
</head>
<body>
    <form action="">
        <div id="login_box">
            <h2>Member Login</h2>
            <ul>
                <li id="id_pass">
                    <ul>
                        <li>
                            <span>ID</span> 
                            <input type="text" name="id">
                        </li>
                        <li id="pass">
                            <span>PW</span>
                            <input type="password" name="password">
                        </li>
                    </ul>
                </li>
                <li id="login_btn">
                    <button type="submit">로그인</button>
                </li>
            </ul>
            <ul id="btns">
                <li><a href="#">회원가입</a></li>
                <li><a href="#">아이디/비밀번호 찾기</a></li>
            </ul>
        </div>
        


    </form>
     <a href="index.html">돌아가기</a>

</body>
</html>
