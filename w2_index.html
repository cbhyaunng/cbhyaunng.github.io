    <a href="https://google.com" target="_parent"><b>구글 사이트로 이동 </b></a><br><br>
    <a href="https://gachon.ac.kr" target="_self"><b>가천대 사이트로 이동 </b></a><br><br>
    <a href="https://google.com" target="_top"><b>구글 사이트로 이동 </b></a><br><br>
    <!-- a 태그를 사용하여 링크를 생성, 링크된 페이지도 같은 경로에 있어야함 
     href 철자 주의-->
    <!-- target 지정 안하면 target="_self"와 동일 -->
    <!-- target="_blank"는 새로운 탭에서 페이지를 열도록 지정 -->
    <!-- target="_parent"는 부모 프레임에서 페이지를 열도록 지정 -->
    <!-- target="_self"는 현재 프레임에서 페이지를 열도록 지정 -->
    <!-- target="_top"는 최상위 프레임에서 페이지를 열도록 지정 -->
    <!-- 네비게이션바 이용이 아니라 내 사이트안에서 자유롭게 이동 가능해야함 -->

    <!-- 메인페이지의 홈페이지는 무조건 index.html 이어야 함 -->
</body>
</html>
