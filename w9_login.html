<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <style>
        *
        {
            margin: 0;
            padding: 0;
        }
        body{
            font-family: "돋움";
            font-size: 12px;
            color:#444444;
        }
        ul{
            list-style-type:none;
        }
        h2{
            margin: 20px 0 0 0;
        }
        #login_title{
            width: 585px;
            padding:10px;
            margin:50px;
            font-size:20px;
            border:solid 5px #e6e2d7;
        }
        #login_box{
            width: 610px;
            height: 283px;
            margin:20px 0 0 50px;
            border:solid 2px #cccccc;
            border-radius:20px; /* 테두리의 모서리를 둥글게 만드는 속성입니다. 숫자가 클수록 더 둥글게 됩니다. */
        }
        #member_login{
            margin: 30px 0 0 100px;
        }
        #login{
            margin: 20px 0 0 50px;
        }
        #left{
            display:inline-block;
            margin-top:0px;
        }
        #right{
            display:inline-block;
            margin-left:30px;
        }
        #id_pass,#login_btn{
            display:inline-block;
            vertical-align: top;
        }
        #id_pass span{
            display:inline-block;
            width: 50px;
        }
        #pass{
            margin-top: 10px;
        }
        #auto_login{
            margin: 15px 0 0 25px;
        }
        #join_find{
            margin: 15px 0 0 25px;
        }
        #join_find li{
            padding: 2px;
            list-style-type: disc;
        }
    </style>
</head>
<body>
    <h2 id="login_title">로그인</h2>
    <div id="login_box">
        <img id="member_login" src="login_notice.png" alt="" width="300">
        <ul id="login">
            <li id="left">
                <img src="lock.png" alt="" width="100">
            </li> <!-- left -->
            <li id="right">
                <ul>
                    <li id="id_pass">
                        <ul>
                            <li>
                                <span>아 이 디</span>
                                <input type="text">
                            </li>
                            <li id="pass">
                                <span>비밀번호</span>
                                <input type="password">
                            </li>
                        </ul>
                    </li><!-- id_pass  -->
                    <li id="login_btn">
                        <img src="login.png" alt="" width="97" height="54">
                    </li>
                </ul>
                <div id="auto_login">
                    <input type="checkbox">자동 로그인
                </div>
                <ul id="join_find">
                    <li>아직 회원이 아니세요?</li>
                    <li>아이디 또는 비밀번호를 잊으셨나요?</li>
                </ul>
            </li>
        </ul>
    </div>
    <a href="index.html">돌아가기</a>
    
</body>
</html>
