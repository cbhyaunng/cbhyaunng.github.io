<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 스타일태그 html 이랑 문법 다름 -->
    <style> 
        table, th, tr, td{ 
            /* 요소선택자 */
            border:dashed 1px rgb(53, 210, 79); /* border-테두리, 세미콜론 넣어야함 */
            border-collapse: collapse; /* 이 속성을 넣어야 일반적인 표 모양이 나옴 */
            /* margin:10px; */
            padding: 15px;
        }
    </style>
    <title></title>
</head>
<body>
    <h3>오늘의 날씨</h3>
    <table>
        <tr>
            <th>지역</th>
            <th>현재기온</th>
            <th colspan="2">불쾌지수/습도(%)</th> <!-- 셀 합병 (열합병, 행합병)-->
            
            <th>풍속(m/s)</th>
        </tr>
        <tr>
            <td rowspan="2">서울/경기</td>
            <td>23</td>
            <td>60</td>
            <td>88</td>
            <td>4.7</td>
        </tr>
        <tr>
            <!-- <td>경기도</td> -->
            <td>28</td>
            <td>68</td>
            <td>88</td>
            <td>5.0</td>
        </tr>
        <tr>
            <td>제주도</td>
            <td>29</td>
            <td>66</td>
            <td>83</td>
            <td>5.8</td>
        </tr>
    </table>
</body>
</html>
