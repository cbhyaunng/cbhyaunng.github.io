<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오사카 여행</title>
    <style>
        #page{
            width:980px;
            margin:0 auto;
        }
        #sitemap{
            padding: 20px 0 0 15px;
        }
        #sitemap div{
            height:140px;
            float:left;
            margin:0 15px 0 15px;
        }
        #sitemap h3{
            font-size: 15px;
            color:#12b9b2;
            margin-left:50px;
        }
        #sitemap ul{
            color:#666666;
        }
        #sitemap li{
            margin:5px 0 0 20px;
            list-style-image:url("blue.png");
        }
    </style>
</head>
<body>
    <div id="page">
        <main>
            <section id="sitemap">
                    <div>
                        <h3>여행지</h3>
                        <ul>
                            <li>오사카</li>
                            <li>교토</li>
                            <li>나고야</li>
                        </ul>
                    </div>
                    <div>
                        <h3>숙소</h3>
                        <ul>
                            <li>호텔</li>
                            <li>리조트</li>
                            <li>게스트하우스</li>
                        </ul>
                    </div>
                    <div>
                        <h3>음식</h3>
                        <ul>
                            <li>일식</li>
                            <li>중식</li>
                            <li>양식</li>
                        </ul>
                    </div>
                    <div>
                        <h3>쇼핑</h3>
                        <ul>
                            <li>의류</li>
                            <li>화장품</li>
                            <li>기념품</li>
                        </ul>
                    </div>
                    <div>
                        <h3>교통</h3>
                        <ul>
                            <li>지하철</li>
                            <li>버스</li>
                            <li>택시</li>
                        </ul>
                    </div>
                    <div>
                        <h3>기타</h3>
                        <ul>
                            <li>여행 팁</li>
                            <li>여행 일정</li>
                            <li>여행 후기</li>
                        </ul>
                    </div>
            </section>
            <div class="clear"></div>
        </main>
    </div>
    
</body>
</html>
