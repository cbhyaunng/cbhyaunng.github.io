<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="common.css">
    <title>오사카 여행</title>
    <style>
        /* 여행으로 */
        #page{
            width:980px;
            margin:0 auto;
        }
        header #logo{
            float:left;
            margin: 15px 0 0 20px;

        }
        header #moto{
            float:left;
            margin: 45px 0 0 20px;
        }
        header #top_menu{
            float:right;
            margin: 50px 0 0 0;
        }
        header #top_menu li{
            display:inline-block;
        }
        .line{
            margin-top:25px;
            border-top:1px solid #cccccc;
        }
        header nav ul{
            margin-top:25px;
        }
        header nav li{
            display:inline;
        }
        header nav li.item{
            margin-left:40px;
        }
    </style>
</head>
<body>
    <div id="page">
        <header>
            <img id="logo" src="changmin_logo.png" width="126" height="57">
            <img id="moto"src="japan.png" height="15">
            <ul id="top_menu">
                <li>로그인 |</li>
                <li>회원가입 |</li>
                <li>사이트 맵 |</li>
                <li>회사 소개 |</li>
            </ul>
            <div class="clear"></div>
            <div class="line"></div>

            <nav>
                <ul>
                    <li><img src="osaka.png" width="158" height="41"></li>
                    <li class="item"><img src="osaka_map.png" width="158" height="41"></li>
                    <li class="item"><img src="osaka_play.png" width="158" height="41"></li>
                    <li class="item"><img src="osaka_eat.png" width="158" height="41"></li>
                    <li class="item"><img src="osaka_feature.png" width="158" height="41"></li>
                </ul>
            </nav>
        </header>
    </div>
</body>
</html>
