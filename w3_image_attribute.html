<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 태그의 속성</title>
</head>
<body>
    <h3>해당화</h3> <!-- h태그는 블럭태그, 한 행을 다 사용함 -->
    <img src="flower2.jpg" title="해당화 원본"> <!-- 이미지 태그는 인라인태그 임 -->
    <img src="flower2.jpg" width="300" height="212" title="해당화(300x212)"><!-- 단위는 픽셀 -->
    <img src="flower2.jpg" width="150" title="해당화(가로:150, 세로:자동계산)">
    <!-- title 은 마우스커서을 올려놓았을때 나오는 제목임 -->
</body>
</html>
